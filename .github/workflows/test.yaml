on:
  push:
    branches:
      - "**"
jobs:
  ubuntu-test:
    name: test on all operating systems
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: fetch submodules over https
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake valgrind lcov
      - name: compile
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build .
      - name: run tests
        run: |
          cd build
          cmake --build . --target coverage